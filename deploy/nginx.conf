# Sample nginx server block for a VPS (PHP-FPM 8.4). Adjust the domain, paths and PHP socket.
# One canonical host: https + non-www. Laravel handles the remaining canonical rules (lowercase, trailing slash).

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;
    # ssl_certificate / ssl_certificate_key …
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;
    root /var/www/alnakheel/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;

    # ssl_certificate / ssl_certificate_key …

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/ld+json image/svg+xml;
    # With ngx_brotli: brotli on; brotli_types <same list>;

    # Hashed/versioned assets: one year, immutable.
    location ~ ^/(build|css/filament|js/filament|fonts/filament)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded photos, placeholders and OG images: 30 days.
    location ~ ^/(storage|images|og)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
}
